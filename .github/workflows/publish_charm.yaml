name: Publish Charm

on:
  push:
    branches:
      - main
    paths-ignore:
      - "bundle/**"
      # Integration tests skip the build when only these files change, so
      # there is nothing to publish. Keep in sync with integration_test.yaml.
      # operator-workflows' integration tests ignore these by default:
      - "**.md"
      - "**.rst"
      - "**.custom_wordlist.txt"
      - "LICENSE"
      # extra-ignored-file-patterns in integration_test.yaml:
      - "apm.yml"
      - "apm.lock.yaml"
      - ".agents/**"
      - ".github/agents/**"
      - ".github/instructions/**"
  workflow_dispatch:

run-name: Release charm by @${{ github.actor }}

jobs:
  upload-datahub-k8s:
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@main
    with:
      channel: "latest/edge"
      resource-mapping: '{"datahub-actions": "datahub-actions", "datahub-frontend": "datahub-frontend", "datahub-gms": "datahub-gms"}'
    secrets: inherit
    permissions:
      contents: write
