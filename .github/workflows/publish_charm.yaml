name: Publish Charm

on:
  push:
    branches:
      - main
    # Keep the APM entries in sync with extra-ignored-file-patterns in
    # integration_test.yaml: integration tests skip these changes, so there
    # is no build to publish.
    paths-ignore:
      - "bundle/**"
      - "apm.yml"
      - "apm.lock.yaml"
      - ".agents/**"
      - ".github/agents/**"
      - ".github/instructions/**"
  workflow_dispatch:

run-name: Release charm by @${{ github.actor }}

jobs:
  upload-datahub-k8s:
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@main
    with:
      channel: "latest/edge"
      resource-mapping: '{"datahub-actions": "datahub-actions", "datahub-frontend": "datahub-frontend", "datahub-gms": "datahub-gms"}'
    secrets: inherit
    permissions:
      contents: write
