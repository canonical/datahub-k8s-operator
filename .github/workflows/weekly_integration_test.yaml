name: Weekly integration tests (Juju 4)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 3 * * 2"
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration tests (multi-cloud, juju 4/stable)
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      runs-on: "self-hosted-linux-amd64-noble-xlarge"
      provider: "k8s"
      channel: "1.32-classic/stable"
      use-canonical-k8s: true
      upload-image: "artifact"
      pre-run-script: .github/scripts/setup-artifact-import.sh
      extra-arguments: |
        --kube-config=~/.kube/config
      juju-channel: "4/stable"
      trivy-severity-config: CRITICAL
      modules: >-
        ["test_charm.py",
        "test_upgrade.py",
        "test_scaling.py",
        "test_trino_catalog.py",
        "test_observability.py",
        "test_datahub_client.py"]
      with-uv: true
